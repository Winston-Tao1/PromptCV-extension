<!DOCTYPE html>
<html>
<head>
    <title>Model Service Integration Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .warning { background: #fff3cd; color: #856404; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Model Service Integration Test</h1>
    
    <div class="section">
        <h2>测试 1: 配置验证</h2>
        <button onclick="testConfigValidation()">运行配置验证测试</button>
        <div id="config-test-result"></div>
    </div>

    <div class="section">
        <h2>测试 2: 模拟润色请求</h2>
        <button onclick="testPolishRequest()">运行润色请求测试</button>
        <div id="polish-test-result"></div>
    </div>

    <div class="section">
        <h2>测试 3: 模拟反推请求</h2>
        <button onclick="testReverseRequest()">运行反推请求测试</button>
        <div id="reverse-test-result"></div>
    </div>

    <div class="section">
        <h2>测试 4: 错误处理测试</h2>
        <button onclick="testErrorHandling()">运行错误处理测试</button>
        <div id="error-test-result"></div>
    </div>

    <script src="modelService.js"></script>
    <script>
        function showResult(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="test-result ${type}">${message}</div>`;
        }

        // 测试 1: 配置验证
        async function testConfigValidation() {
            const resultDiv = 'config-test-result';
            try {
                if (!window.modelService) {
                    showResult(resultDiv, '❌ modelService 未加载', 'error');
                    return;
                }

                // 测试有效配置
                const validConfig = {
                    baseUrl: 'https://api.example.com',
                    apiKey: 'test-key-123',
                    modelName: 'gpt-3.5-turbo'
                };

                const validResult = window.modelService.validateConfig(validConfig);
                if (!validResult.valid) {
                    showResult(resultDiv, `❌ 有效配置验证失败: ${validResult.message}`, 'error');
                    return;
                }

                // 测试无效配置
                const invalidConfig = {
                    baseUrl: '',
                    apiKey: 'test-key',
                    modelName: 'test-model'
                };

                const invalidResult = window.modelService.validateConfig(invalidConfig);
                if (invalidResult.valid) {
                    showResult(resultDiv, '❌ 无效配置应该被拒绝', 'error');
                    return;
                }

                // 测试支持的供应商
                const providers = window.modelService.getSupportedProviders();
                if (!providers || providers.length === 0) {
                    showResult(resultDiv, '❌ 供应商列表为空', 'error');
                    return;
                }

                showResult(resultDiv, 
                    `✅ 配置验证测试通过<br>
                    有效配置: ${validResult.message}<br>
                    无效配置: ${invalidResult.message}<br>
                    支持供应商: ${providers.join(', ')}`, 
                    'success');

            } catch (error) {
                showResult(resultDiv, `❌ 测试异常: ${error.message}`, 'error');
            }
        }

        // 测试 2: 模拟润色请求（不实际调用API）
        async function testPolishRequest() {
            const resultDiv = 'polish-test-result';
            try {
                if (!window.modelService) {
                    showResult(resultDiv, '❌ modelService 未加载', 'error');
                    return;
                }

                const testConfig = {
                    baseUrl: 'https://api.example.com',
                    apiKey: 'test-key-123',
                    modelName: 'gpt-3.5-turbo'
                };

                // 验证配置
                const validation = window.modelService.validateConfig(testConfig);
                if (!validation.valid) {
                    showResult(resultDiv, `❌ 配置验证失败: ${validation.message}`, 'error');
                    return;
                }

                // 模拟润色过程（不实际调用API）
                const testContent = '帮我写个hello world';
                const messages = [
                    {
                        role: 'system',
                        content: '你是一个专业的提示词优化助手。你的任务是优化用户提供的提示词，使其更加清晰、专业、有效。请保持原意的同时，改进措辞、结构和逻辑。'
                    },
                    {
                        role: 'user',
                        content: `请优化以下提示词，使其更加专业和有效：\n\n${testContent}`
                    }
                ];

                showResult(resultDiv, 
                    `✅ 润色请求准备完成<br>
                    配置: ${testConfig.modelName}<br>
                    输入: "${testContent}"<br>
                    消息数: ${messages.length}<br>
                    预期: 调用 callModel() 方法`, 
                    'success');

            } catch (error) {
                showResult(resultDiv, `❌ 测试异常: ${error.message}`, 'error');
            }
        }

        // 测试 3: 模拟反推请求
        async function testReverseRequest() {
            const resultDiv = 'reverse-test-result';
            try {
                if (!window.modelService) {
                    showResult(resultDiv, '❌ modelService 未加载', 'error');
                    return;
                }

                const testConfig = {
                    baseUrl: 'https://api.example.com',
                    apiKey: 'test-key-123',
                    modelName: 'gpt-3.5-turbo'
                };

                const validation = window.modelService.validateConfig(testConfig);
                if (!validation.valid) {
                    showResult(resultDiv, `❌ 配置验证失败: ${validation.message}`, 'error');
                    return;
                }

                const testContent = '这是一个测试的AI回复内容，用于测试反推功能';
                const messages = [
                    {
                        role: 'system',
                        content: '你是一个提示词分析专家。你的任务是根据AI生成的内容，推测最可能产生这个输出的提示词。请分析用户可能的意图、格式要求和关键词，然后给出推测的完整提示词。直接给出提示词，不需要额外解释。'
                    },
                    {
                        role: 'user',
                        content: `请分析以下AI生成的内容，推测出最可能产生这个输出的提示词：\n\n${testContent}\n\n请直接给出推测的提示词，不需要其他解释。`
                    }
                ];

                showResult(resultDiv, 
                    `✅ 反推请求准备完成<br>
                    配置: ${testConfig.modelName}<br>
                    输入: "${testContent}"<br>
                    消息数: ${messages.length}<br>
                    预期: 调用 callModel() 方法`, 
                    'success');

            } catch (error) {
                showResult(resultDiv, `❌ 测试异常: ${error.message}`, 'error');
            }
        }

        // 测试 4: 错误处理测试
        async function testErrorHandling() {
            const resultDiv = 'error-test-result';
            try {
                if (!window.modelService) {
                    showResult(resultDiv, '❌ modelService 未加载', 'error');
                    return;
                }

                // 测试空配置
                const emptyConfig = null;
                const result1 = window.modelService.validateConfig(emptyConfig);
                
                // 测试缺少字段的配置
                const incompleteConfig = { baseUrl: 'https://api.example.com' };
                const result2 = window.modelService.validateConfig(incompleteConfig);

                // 测试无效URL
                const invalidUrlConfig = {
                    baseUrl: 'not-a-url',
                    apiKey: 'test-key',
                    modelName: 'test-model'
                };
                const result3 = window.modelService.validateConfig(invalidUrlConfig);

                const allTestsPassed = 
                    !result1.valid && 
                    !result2.valid && 
                    !result3.valid;

                if (allTestsPassed) {
                    showResult(resultDiv, 
                        `✅ 错误处理测试通过<br>
                        空配置: ${result1.message}<br>
                        不完整配置: ${result2.message}<br>
                        无效URL: ${result3.message}`, 
                        'success');
                } else {
                    showResult(resultDiv, '❌ 某些错误处理测试失败', 'error');
                }

            } catch (error) {
                showResult(resultDiv, `❌ 测试异常: ${error.message}`, 'error');
            }
        }

        // 页面加载时自动运行基础测试
        window.addEventListener('load', () => {
            setTimeout(() => {
                testConfigValidation();
            }, 500);
        });
    </script>
</body>
</html>
