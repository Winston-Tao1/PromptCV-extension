<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt - AI提示词管理器</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        // CRITICAL: Check and redirect IMMEDIATELY before any rendering
        (async function() {
            try {
                const result = await chrome.storage.local.get(['lastPage']);
                if (result.lastPage === 'settings') {
                    // Redirect immediately
                    window.location.replace('settings.html');
                }
            } catch (error) {
                console.error('Failed to check last page:', error);
            }
        })();
    </script>
</head>
<body>
    <!-- Google Rainbow Border -->
    <div class="rainbow-border"></div>
    
    <!-- Header -->
    <div class="header">
        <div class="header-title">
            <div class="header-icon-wrapper" id="header-icon-wrapper">
                <span class="header-icon" id="header-icon"></span>
                <span class="header-icon-upload" aria-hidden="true"></span>
            </div>
            <h1 id="app-title" class="editable-title" title="点击编辑">Prompt</h1>
            <input type="file" id="logo-file-input" accept="image/*" style="display: none;">
            <button class="settings-btn" id="settings-btn" title="设置">
                <img src="icons/tabs_setting.png" alt="设置">
            </button>
        </div>
        <div class="header-subtitle">专业AI提示词管理工具</div>
    </div>
    
    <!-- Logo will be loaded by popup.js to prevent conflicts -->
    
    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="favorites">
            <span class="tab-icon"></span>
            <span>收藏</span>
        </button>
        <button class="tab-btn" data-tab="all">
            <span class="tab-icon"></span>
            <span>全部</span>
        </button>
        <button class="tab-btn" data-tab="add">
            <span class="tab-icon"></span>
            <span>添加</span>
        </button>
        <button class="tab-btn" data-tab="reverse">
            <span class="tab-icon"></span>
            <span>反推</span>
        </button>
        <button class="tab-btn" data-tab="cloud">
            <span class="tab-icon"></span>
            <span>缓存</span>
        </button>
    </div>
    
    <!-- Content Area -->
    <div class="content">
        <!-- Favorites Tab -->
        <div id="favorites" class="tab-content active">
            <div id="favorites-list"></div>
            <div id="favorites-empty" class="empty-state" style="display: none;">
                <div class="empty-icon" style="background-image: url('icons/tabs_star.png');"></div>
                <h3>暂无收藏的提示词</h3>
                <p>点击提示词卡片上的星标可以添加收藏<br>收藏的提示词会显示在这里，方便快速访问</p>
            </div>
        </div>
        
        <!-- All Prompts Tab -->
        <div id="all" class="tab-content">
            <div id="all-list"></div>
            <div id="all-empty" class="empty-state" style="display: none;">
                <div class="empty-icon" style="background-image: url('icons/tabs_list.png');"></div>
                <h3>提示词库为空</h3>
                <p>点击"添加"按钮创建你的第一条提示词<br>所有提示词会按时间顺序显示在这里</p>
            </div>
        </div>
        
        <!-- Add Prompt Tab -->
        <div id="add" class="tab-content">
            <form class="add-prompt-form" id="add-prompt-form">
                <div class="form-group">
                    <label class="form-label">
                        <span>标签（最多选择3个）</span>
                    </label>
                    <div class="tag-cloud-container" id="tag-cloud-container">
                        <button type="button" class="tag-cloud-btn" data-tag="代码编程">代码编程</button>
                        <button type="button" class="tag-cloud-btn" data-tag="内容创作">内容创作</button>
                        <button type="button" class="tag-cloud-btn" data-tag="学习研究">学习研究</button>
                        <button type="button" class="tag-cloud-btn" data-tag="工作办公">工作办公</button>
                        <button type="button" class="tag-cloud-btn" data-tag="生活娱乐">生活娱乐</button>
                        <button type="button" class="tag-cloud-btn" data-tag="专业领域">专业领域</button>
                        <button type="button" class="tag-cloud-btn" data-tag="DeepSeek">DeepSeek</button>
                        <button type="button" class="tag-cloud-btn" data-tag="ChatGPT">ChatGPT</button>
                        <button type="button" class="tag-cloud-btn" data-tag="Grok">Grok</button>
                        <button type="button" class="tag-cloud-btn" data-tag="Gemini">Gemini</button>
                        <button type="button" class="tag-cloud-btn" data-tag="豆包">豆包</button>
                        <button type="button" class="tag-cloud-btn" data-tag="Claude">Claude</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <span>提示词内容</span>
                    </label>
                    <textarea 
                        class="form-control" 
                        id="prompt-content" 
                        placeholder="请输入完整的提示词内容...&#10;&#10;例如：&#10;请帮我绘制一张插图，用于公司会议的PPT。重点关注：&#10;1. 风格要极简商务&#10;2. 配色最好是浅蓝色搭配白色&#10;3. 不要太多线条和色彩&#10;4. 插图核心是某产品的架构部分"
                        required></textarea>
                </div>
                
                <button type="button" class="save-btn" id="save-btn">
                    <img src="icons/add.png" class="save-btn-icon" alt="保存">
                    <span>保存</span>
                </button>
            </form>
        </div>
        
        <!-- Reverse Tab -->
        <div id="reverse" class="tab-content">
            <form class="add-prompt-form" id="reverse-prompt-form">
                <div class="form-group" style="flex: 1;">
                    <label class="form-label">
                        <span>粘贴AI生成的长文本</span>
                    </label>
                    <textarea 
                        class="form-control" 
                        id="reverse-input" 
                        placeholder="请粘贴AI生成的长文本内容...&#10;&#10;系统将分析文本特征，反推出最可能产生该输出的提示词。"
                        required></textarea>
                </div>
                
                <button type="button" class="save-btn" id="reverse-btn">
                    <img src="icons/reverse.png" class="save-btn-icon" alt="反推">
                    <span>开始反推</span>
                </button>
            </form>
        </div>
        
        <!-- Cache Tab -->
        <div id="cloud" class="tab-content">
            <div class="cloud-editor">
                <!-- Formatting Toolbar -->
                <div class="cloud-toolbar">
                    <button type="button" class="toolbar-btn" id="bold-btn" data-command="bold" title="加粗">
                        <strong>B</strong>
                    </button>
                    <select class="toolbar-select" id="font-select" title="字体">
                        <option value="Arial">Arial</option>
                        <option value="'Times New Roman'">Times New Roman</option>
                        <option value="'Courier New'">Courier New</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Verdana">Verdana</option>
                        <option value="'Comic Sans MS'">Comic Sans MS</option>
                        <option value="'Microsoft YaHei', 微软雅黑">微软雅黑</option>
                        <option value="SimSun, 宋体">宋体</option>
                        <option value="SimHei, 黑体">黑体</option>
                        <option value="KaiTi, 楷体">楷体</option>
                    </select>
                    <select class="toolbar-select" id="font-size-select" title="字体大小">
                        <option value="1">8pt</option>
                        <option value="2">10pt</option>
                        <option value="3" selected>12pt</option>
                        <option value="4">14pt</option>
                        <option value="5">18pt</option>
                        <option value="6">24pt</option>
                        <option value="7">36pt</option>
                    </select>
                    <button type="button" class="toolbar-btn color-picker-btn" id="font-color-btn" title="字体颜色">
                        <span class="color-preview" style="color: #000000;">A</span>
                    </button>
                    <button type="button" class="toolbar-btn color-picker-btn" id="bg-color-btn" title="背景颜色">
                        <span class="color-preview" style="background: transparent; border: 1px solid #DADCE0;"></span>
                    </button>
                </div>
                
                <!-- Rich Text Editor -->
                <div class="cloud-content" contenteditable="true" id="cloud-editor" placeholder="在此输入任意格式内容，支持粘贴图片、文件等...自动保存到本地"></div>
                
                <!-- Action Buttons -->
                <div class="cloud-actions">
                    <button type="button" class="cloud-save-btn" id="cloud-save-btn">
                        <img src="icons/tabs_cache.png" class="save-btn-icon" alt="保存">
                        <span>保存</span>
                    </button>
                    <button type="button" class="cloud-upload-btn" id="cloud-upload-btn">
                        上传文件
                    </button>
                    <input type="file" id="cloud-file-input" style="display: none;" multiple>
                </div>
            </div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
